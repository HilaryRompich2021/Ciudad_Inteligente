apiVersion: 1

datasources:
  - name: PostgreSQL-Ciudades
    type: postgres
    access: proxy
    url: host.docker.internal:5432
    database: ciudades
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
