services:
  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: platform-airflow-webserver
    depends_on:
      - airflow-scheduler
      - airflow-init
    command: webserver
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@platform-postgres-1:5432/ciudades
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8082:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    networks:
      - platform_default

  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: platform-airflow-scheduler
    depends_on:
      - airflow-init
    command: scheduler
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@platform-postgres-1:5432/ciudades
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
    networks:
      - platform_default

  airflow-init:
    image: apache/airflow:2.9.0
    container_name: platform-airflow-init
    entrypoint: bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@platform-postgres-1:5432/ciudades
    networks:
      - platform_default

networks:
  platform_default:
    external: true
