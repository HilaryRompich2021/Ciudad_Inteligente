services:
  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: platform-airflow-webserver
    depends_on:
      - airflow-scheduler
    command: webserver
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8082:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_data:/opt/airflow
    networks:
      - platform_default

  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: platform-airflow-scheduler
    command: scheduler
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_data:/opt/airflow
    networks:
      - platform_default

networks:
  platform_default:
    external: true
