version: "3.8"

services:
  correlator:
    build: .
    container_name: correlator-correlator-1
    ports:
      - "8080:8080"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=platform-kafka-1:9092
      - SPRING_REDIS_HOST=platform-redis-1
      - SPRING_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:postgresql://platform-postgres-1:5432/ciudades
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    volumes:
      - ./src/main/resources/application.yml:/app/resources/application.yml
    networks:
      - platform_default

networks:
  platform_default:
    external: true
